name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Zig 0.16.0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Verify Zig version
        run: test "$(zig version)" = "0.16.0"
      - name: Check formatting
        run: zig fmt --check build.zig src
      - name: Run unit tests
        run: zig build test
      - name: Build executable
        run: zig build
